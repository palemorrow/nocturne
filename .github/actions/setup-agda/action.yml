name: setup agda
description: install the checked agda release and standard library

runs:
  using: composite
  steps:
    - uses: haskell-actions/setup@v2
      with:
        ghc-version: '9.6.7'
    - uses: actions/cache@v4
      with:
        path: .deps/agda-stdlib-2.3
        key: nocturne-stdlib-2.3-agda-2.8.0-${{ runner.os }}-${{ runner.arch }}
    - shell: bash
      run: |
        sh tools/agda.sh
        echo "$PWD/.deps/bin" >> "$GITHUB_PATH"
        make deps
